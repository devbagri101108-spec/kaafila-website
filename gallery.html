<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery | Kaafila 2026 — Shiv Nadar School</title>
<meta name="description" content="Kaafila 2026 photo gallery — Music, Dance, Visual Arts, Theatre, and Photography.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@400;500;600;700&family=Alex+Brush&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>

<header class="site-header">
  <div class="container nav-row">
    <a href="index.html" class="wordmark">
      <span class="name">KAAFILA</span>
      <span class="school">Shiv Nadar School</span>
    </a>
    <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="primary-nav">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="2" y1="5" x2="18" y2="5"/><line x1="2" y1="10" x2="18" y2="10"/><line x1="2" y1="15" x2="18" y2="15"/></svg>
    </button>
    <nav class="nav-links" id="primary-nav" aria-label="Primary">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="gallery.html" aria-current="page">Gallery</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
  <div class="weft" role="presentation"></div>
</header>

<main id="main-content">
  <section class="section" data-band="navy" style="padding-bottom: 1rem;">
    <div class="container">
      <p class="eyebrow">Kaafila 2026</p>
      <h1 class="section-title" style="font-size: 2.4rem;">Gallery</h1>
    </div>
  </section>

  <section class="section" data-band="white" style="padding-top: 1rem;">
    <div class="container">
      <div class="filters" data-filter-group=".gallery-tile" role="group" aria-label="Filter gallery by category">
        <button class="filter-btn is-active" data-cat="all" aria-pressed="true">All</button>
        <button class="filter-btn" data-cat="music" aria-pressed="false">Music</button>
        <button class="filter-btn" data-cat="dance" aria-pressed="false">Dance</button>
        <button class="filter-btn" data-cat="visual" aria-pressed="false">Visual Arts</button>
        <button class="filter-btn" data-cat="theatre" aria-pressed="false">Theatre</button>
        <button class="filter-btn" data-cat="photo" aria-pressed="false">Photography</button>
      </div>

      <div class="gallery-grid" data-reveal-group></div>

      <p class="schedule-note" data-empty-state style="margin-top: 2rem; border: 1px dashed var(--band-line-strong); padding: 1.5rem; text-align: center;">
        Photos from Kaafila 2026 will be added here once the festival gets underway. Check back during and after the event.
      </p>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="weft" role="presentation"></div>
  <div class="container footer-row" style="padding-top: 1.5rem;">
    <span>© 2026 Shiv Nadar School · Kaafila</span>
    <span>Tanahbana — The Timelessness of Humanity</span>
  </div>
</footer>

<script src="js/main.js"></script>
</body>
</html>
